name: Build Website

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
            fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Prepare java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.6.1673

      - name: Checkout main project repository
        uses: actions/checkout@v5
        with:
          repository: repath-studio/repath-studio
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: repath-studio

      - name: Install repath-studio dependencies
        run: npm ci
        working-directory: repath-studio

      - name: Generate roadmap
        run: |
          npm install
          npm run generate-roadmap
        env:
          ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - run: npm run sync-docs
      - run: npm run install-python-deps
      - run: npm run deploy
